server.port=${SERVER_PORT:8080}

# ===== 鉴权与访问控制配置 =====
# 允许的客户端/服务端时钟偏差（秒），双向生效：时间戳落在 now ± skew 内即通过
app.auth.timestamp-skew-seconds=${AUTH_TIMESTAMP_SKEW_SECONDS:300}
# 已用请求标识(nonce)的保留时长（秒），必须 >= 时间戳窗口以覆盖重放
app.auth.nonce-ttl-seconds=${AUTH_NONCE_TTL_SECONDS:600}
# 限流统计窗口长度（秒），固定窗口
app.auth.rate-window-seconds=${AUTH_RATE_WINDOW_SECONDS:60}

# ----- 客户端注册表 -----
# client-a：数据归属 tenant-a，可读取订单，默认窗口 100 次
app.auth.clients.client-a.secret=c2VjcmV0LWEtc2VjcmV0LWEtc2VjcmV0LQ==
app.auth.clients.client-a.owner=tenant-a
app.auth.clients.client-a.scopes[0]=orders:read
app.auth.clients.client-a.rate-limit=1000

# client-b：数据归属 tenant-b，可读取订单
app.auth.clients.client-b.secret=c2VjcmV0LWItc2VjcmV0LWItc2VjcmV0LQ==
app.auth.clients.client-b.owner=tenant-b
app.auth.clients.client-b.scopes[0]=orders:read
app.auth.clients.client-b.rate-limit=1000

# client-limited：专用于限流验证，每个窗口仅 3 次
app.auth.clients.client-limited.secret=c2VjcmV0LWxpbWl0ZWQtc2VjcmV0LWxpbWl0ZWQtc2VjcmV0LQ==
app.auth.clients.client-limited.owner=tenant-a
app.auth.clients.client-limited.scopes[0]=orders:read
app.auth.clients.client-limited.rate-limit=3

# client-noread：身份有效但没有 orders:read 范围，用于越权(scope)验证
app.auth.clients.client-noread.secret=c2VjcmV0LW5vcmVhZC1zZWNyZXQtbm9yZWFkLXNlY3JldC0=
app.auth.clients.client-noread.owner=tenant-a
app.auth.clients.client-noread.rate-limit=1000

# client-multiscope：同一客户端在两个接口范围上各算各的账（分范围配额）
# 默认（未单独配置的范围）稳态 100/窗口；orders:read 稳态 3、无额外突发；
# orders:export 稳态 5、突发 8（短时间可冲 8 个，之后按 5/窗口回收）
app.auth.clients.client-multiscope.secret=c2VjcmV0LW11bHRpc2NvcGUtc2VjcmV0LW11bHRpc2NvcGUtc2VjcmV0LQ==
app.auth.clients.client-multiscope.owner=tenant-a
app.auth.clients.client-multiscope.scopes[0]=orders:read
app.auth.clients.client-multiscope.scopes[1]=orders:export
app.auth.clients.client-multiscope.rate-limit=100
app.auth.clients.client-multiscope.scope-quotas[0].scope=orders:read
app.auth.clients.client-multiscope.scope-quotas[0].rate-limit=3
app.auth.clients.client-multiscope.scope-quotas[0].burst-limit=3
app.auth.clients.client-multiscope.scope-quotas[1].scope=orders:export
app.auth.clients.client-multiscope.scope-quotas[1].rate-limit=5
app.auth.clients.client-multiscope.scope-quotas[1].burst-limit=8

# client-burst：默认稳态 2/窗口，突发上限 5（不配分范围，orders:read 走默认配额）
# 用于验证"突发整波放行、见底即拒、之后平滑回收到稳态"
# 同时授了 orders:read 与 orders:export 两个范围：两个范围都没有单独配额，
# 共同分享同一份默认突发桶（全客户端只有一份默认额度）
app.auth.clients.client-burst.secret=c2VjcmV0LWJ1cnN0LXNlY3JldC1idXJzdC1zZWNyZXQt
app.auth.clients.client-burst.owner=tenant-a
app.auth.clients.client-burst.scopes[0]=orders:read
app.auth.clients.client-burst.scopes[1]=orders:export
app.auth.clients.client-burst.rate-limit=2
app.auth.clients.client-burst.burst-limit=5

# client-legacy：老配置客户端——授了多个接口范围，但没配分范围额度、也没配突发余量。
# 升级前整个客户端共用一份默认额度（固定窗口 4 次/窗口）；修复后必须保持：
# 两个范围跨范围合计共用同一份默认额度，窗口切换行为与拆分前完全一致
app.auth.clients.client-legacy.secret=c2VjcmV0LWxlZ2FjeS1zZWNyZXQtbGVnYWN5LXNlY3JldC0=
app.auth.clients.client-legacy.owner=tenant-a
app.auth.clients.client-legacy.scopes[0]=orders:read
app.auth.clients.client-legacy.scopes[1]=orders:export
app.auth.clients.client-legacy.rate-limit=4

logging.level.com.github.feng111627=INFO
