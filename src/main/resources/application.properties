server.port=${SERVER_PORT:8080}

# ===== 鉴权与访问控制配置 =====
# 允许的客户端/服务端时钟偏差（秒），双向生效：时间戳落在 now ± skew 内即通过
app.auth.timestamp-skew-seconds=${AUTH_TIMESTAMP_SKEW_SECONDS:300}
# 已用请求标识(nonce)的保留时长（秒），必须 >= 时间戳窗口以覆盖重放
app.auth.nonce-ttl-seconds=${AUTH_NONCE_TTL_SECONDS:600}
# 限流统计窗口长度（秒），固定窗口
app.auth.rate-window-seconds=${AUTH_RATE_WINDOW_SECONDS:60}

# ----- 客户端注册表 -----
# client-a：数据归属 tenant-a，可读取订单，默认窗口 100 次
app.auth.clients.client-a.secret=c2VjcmV0LWEtc2VjcmV0LWEtc2VjcmV0LQ==
app.auth.clients.client-a.owner=tenant-a
app.auth.clients.client-a.scopes[0]=orders:read
app.auth.clients.client-a.rate-limit=1000

# client-b：数据归属 tenant-b，可读取订单
app.auth.clients.client-b.secret=c2VjcmV0LWItc2VjcmV0LWItc2VjcmV0LQ==
app.auth.clients.client-b.owner=tenant-b
app.auth.clients.client-b.scopes[0]=orders:read
app.auth.clients.client-b.rate-limit=1000

# client-limited：专用于限流验证，每个窗口仅 3 次
app.auth.clients.client-limited.secret=c2VjcmV0LWxpbWl0ZWQtc2VjcmV0LWxpbWl0ZWQtc2VjcmV0LQ==
app.auth.clients.client-limited.owner=tenant-a
app.auth.clients.client-limited.scopes[0]=orders:read
app.auth.clients.client-limited.rate-limit=3

# client-noread：身份有效但没有 orders:read 范围，用于越权(scope)验证
app.auth.clients.client-noread.secret=c2VjcmV0LW5vcmVhZC1zZWNyZXQtbm9yZWFkLXNlY3JldC0=
app.auth.clients.client-noread.owner=tenant-a
app.auth.clients.client-noread.rate-limit=1000

# 分范围配额相关客户端（scope key 含冒号，properties 绑定会截断）放在 application.yml：
#   client-scoped：orders:read 稳态 2 + 突发 2；orders:ping 稳态 5（两范围互不挤占）
#   client-default：orders:ping 未单独配配额，沿用客户端默认 rate-limit=2（旧行为）
#   client-edge：orders:ping 稳态 3 + 突发 0，用于并发达界

logging.level.com.github.feng111627=INFO
